<div class="reset-page">
  <div class="reset-card">
    <div class="reset-header">
      <p class="eyebrow">Persianeitor</p>
      <h1>{{ isAuthenticatedChange ? 'Cambiar contraseña' : 'Restablecer contraseña' }}</h1>
      <p *ngIf="isAuthenticatedChange">Por seguridad, cambia la contraseña temporal antes de continuar.</p>
      <p *ngIf="!token && !isAuthenticatedChange">Token inválido o faltante.</p>
    </div>

    <form class="reset-form" *ngIf="token || isAuthenticatedChange" (ngSubmit)="submit()" [formGroup]="form">
      <label *ngIf="isAuthenticatedChange">
        <span>Contraseña actual</span>
        <input type="password" formControlName="currentPassword" autocomplete="current-password" />
      </label>

      <label>
        <span>Nueva contraseña</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <label>
        <span>Repetir contraseña</span>
        <input type="password" formControlName="confirm" autocomplete="new-password" />
      </label>

      <div class="actions">
        <button type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : (isAuthenticatedChange ? 'Cambiar contraseña' : 'Restablecer contraseña') }}</button>
      </div>

      <div class="message" *ngIf="message">{{ message }}</div>
      <div class="error" *ngIf="error">{{ error }}</div>
    </form>
  </div>
</div>
