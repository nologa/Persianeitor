<div class="form-container">
  <h2>{{ isEditing ? 'Editar Faena' : 'Nueva Faena' }}</h2>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="nombre">Nombre del cliente *</label>
      <input
        type="text"
        id="nombre"
        formControlName="nombre"
        class="form-control"
        placeholder="Nombre completo"
      />
      <div *ngIf="form.get('nombre')?.invalid && form.get('nombre')?.touched" class="error-message">
        El nombre es requerido
      </div>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección *</label>
      <input
        type="text"
        id="direccion"
        formControlName="direccion"
        class="form-control"
        placeholder="Calle y número"
      />
      <div *ngIf="form.get('direccion')?.invalid && form.get('direccion')?.touched" class="error-message">
        La dirección es requerida
      </div>
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono *</label>
      <input
        type="tel"
        id="telefono"
        formControlName="telefono"
        class="form-control"
        placeholder="123456789"
      />
      <div *ngIf="form.get('telefono')?.invalid && form.get('telefono')?.touched" class="error-message">
        El teléfono es requerido
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion">Lo que tenemos que hacer *</label>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        class="form-control"
        placeholder="Describe el trabajo a realizar"
        rows="4"
      ></textarea>
      <div *ngIf="form.get('descripcion')?.invalid && form.get('descripcion')?.touched" class="error-message">
        La descripción es requerida
      </div>
    </div>

    <div class="form-group">
      <label for="presupuesto">Presupuesto</label>
      <input
        type="number"
        id="presupuesto"
        formControlName="presupuesto"
        class="form-control"
        placeholder="Importe total"
        min="0"
        step="0.01"
      />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="estado">Estado *</label>
        <select
          id="estado"
          formControlName="estado"
          class="form-control"
        >
          <option value="pendiente">Pendiente</option>
          <option value="esperando">Esperando confirmación</option>
          <option value="volver_contactar">Volver a contactar</option>
          <option value="hecho">Hecho</option>
          <option value="cobrado">Cobrado</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div class="form-group">
        <label for="fechaEntrega">Fecha programada</label>
        <input
          type="date"
          id="fechaEntrega"
          formControlName="fechaEntrega"
          class="form-control"
        />
      </div>

      <div class="form-group">
        <label for="hora">Hora</label>
        <input
          type="time"
          id="hora"
          formControlName="hora"
          class="form-control"
        />
      </div>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Guardar' }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
